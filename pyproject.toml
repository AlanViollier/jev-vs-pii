[build-system]
requires = ["hatchling>=1.22"]
build-backend = "hatchling.build"

[project]
name = "pii-bench"
version = "0.1.0"
description = "Head-to-head benchmark of PII span detection in English text: rules, NER, a decision model and LLMs, measured on accuracy, calibration, cost and latency."
requires-python = ">=3.12"

dependencies = [
    "pyyaml>=6.0",            # config.yaml parsing (drop if you go full pydantic-settings TOML/env)
    "pydantic>=2.7",          # schema-at-boundary; drop only if the project genuinely has no data model
    "pydantic-settings>=2.2", # typed config + .env loading; replaces hand-rolled get_config()
    "rich>=13",               # human-facing terminal + traceback
    "structlog>=24.1",        # structured logging — default for any pipeline
    "tenacity>=8.2",          # retry/backoff for transient I/O — drop only if the project has no flaky calls
    "typer>=0.27.2",
    "huggingface-hub>=2.0",    # ai4privacy download, pinned revision
    "httpx>=0.28",             # TAB download + Decisions API
    "pyarrow>=17",
]

[project.scripts]
pii-bench = "pii_bench.cli:main"

[project.optional-dependencies]
## The `presidio` lane: Presidio's analyzer and the spaCy model it loads by default.
ner = [
    "presidio-analyzer>=2.2",
    "en-core-web-lg @ https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
    "mypy>=1.0",
    "interrogate>=1.7",       # docstring coverage gate (target 60%)
    "pre-commit>=3.7",
    "types-pyyaml>=6.0.12",
    "hypothesis>=6.100",      # property tests; drop only if the project has nothing invariant to assert
    "pip-audit>=2.7",         # CVE scan against PyPI advisory DB; run via `make audit` + CI
    "nervaluate>=1.2",        # test oracle for exact span matching
]

[tool.hatch.metadata]
allow-direct-references = true  # the spaCy model wheel is only published on GitHub

[tool.hatch.build.targets.wheel]
packages = ["pii_bench"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
## E/F/W   — pycodestyle errors/warnings + pyflakes (standard).
## I       — import sorting (replaces isort).
## UP      — pyupgrade: flag `Union[X, Y]` → `X | Y`, `Dict` → `dict`, etc.
## B       — flake8-bugbear: common bug patterns (mutable defaults, unused loop var, etc.).
## SIM     — flake8-simplify: code-smell simplifications.
## BLE     — flag bare/blind except (`except Exception:`) per STYLE.md.
##           Use `# noqa: BLE001` on the rare legit catch-all at a pipeline boundary.
## T20     — no `print()` in library modules per STYLE.md.
##           Per-file ignores below allow `print()` in CLI scripts + benchmarks.
select = ["E", "F", "W", "I", "UP", "B", "SIM", "BLE", "T20"]
ignore = ["E501", "B008"]  # B008 — pydantic Field(...) at default value is a legit pattern

[tool.ruff.lint.per-file-ignores]
"scripts/**/*.py" = ["T20"]
"benchmarks/**/*.py" = ["T20"]

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.mypy]
explicit_package_bases = true
exclude = ["^data/"]  # downloaded third-party code (TAB's evaluation.py)
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["presidio_analyzer.*"]
ignore_missing_imports = true  # optional extra, absent in CI

[tool.interrogate]
fail-under = 60
ignore-init-method = true
ignore-magic = true
ignore-module = true
exclude = ["data", "tests"]  # downloaded third-party code; test names are their docs
verbose = 0

[tool.pytest.ini_options]
testpaths = ["tests"]
