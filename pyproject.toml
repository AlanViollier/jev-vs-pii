[build-system]
requires = ["hatchling>=1.22"]
build-backend = "hatchling.build"

[project]
name = "jev-vs-pii"
version = "0.1.0"
description = "Head-to-head benchmark of PII span detection in English text: rules, NER, a decision model and LLMs, measured on accuracy, calibration, cost and latency."
requires-python = ">=3.12"

dependencies = [
    "pyyaml>=6.0",             # config.yaml
    "pydantic>=2.7",           # every record in and out
    "pydantic-settings>=2.2",  # config.yaml + .env as one typed settings object
    "rich>=13",                # progress bars
    "tenacity>=8.2",           # retries on provider blips
    "typer>=0.27.2",           # CLI
    "huggingface-hub>=1.5",    # dataset downloads at pinned revisions (transformers needs <2)
    "httpx>=0.28",             # OpenRouter calls, TAB download
    "pyarrow>=17",             # Nemotron-PII parquet
]

[project.scripts]
jev-vs-pii = "jev_vs_pii.cli:main"

[project.optional-dependencies]
## Local models (Presidio + spaCy, OpenAI Privacy Filter, NVIDIA GLiNER-PII) and TAB's official script.
ner = [
    "presidio-analyzer>=2.2",
    "transformers>=4.50",
    "torch>=2.4",
    "gliner>=0.2.21",
    "opf @ git+https://github.com/openai/privacy-filter@f7f00ca7fb869683eb732c010299d901457f19c3",
    ## TAB's official evaluation script imports these and tokenises with spaCy's md model.
    "pandas>=2.2",
    "intervaltree>=3.1",
    "tqdm>=4.66",
    "en-core-web-md @ https://github.com/explosion/spacy-models/releases/download/en_core_web_md-3.8.0/en_core_web_md-3.8.0-py3-none-any.whl",
    "en-core-web-lg @ https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
    "mypy>=1.0",
    "interrogate>=1.7",       # docstring coverage gate, 60%
    "pre-commit>=3.7",
    "types-pyyaml>=6.0.12",
    "hypothesis>=6.100",      # property tests
    "pip-audit>=2.7",         # CVE scan against PyPI advisory DB; run via `make audit` + CI
    "nervaluate>=1.2",        # test oracle for exact span matching
]

[tool.hatch.metadata]
allow-direct-references = true  # the spaCy model wheel is only published on GitHub

[tool.hatch.build.targets.wheel]
packages = ["jev_vs_pii"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
## E/F/W   — pycodestyle errors/warnings + pyflakes (standard).
## I       — import sorting (replaces isort).
## UP      — pyupgrade: flag `Union[X, Y]` → `X | Y`, `Dict` → `dict`, etc.
## B       — flake8-bugbear: common bug patterns (mutable defaults, unused loop var, etc.).
## SIM     — flake8-simplify: code-smell simplifications.
## BLE     — no blind `except Exception:`; catch what can actually go wrong.
## T20     — no `print()`; the CLI writes through typer and rich.
select = ["E", "F", "W", "I", "UP", "B", "SIM", "BLE", "T20"]
ignore = ["E501", "B008"]  # B008 — pydantic Field(...) at default value is a legit pattern

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.mypy]
explicit_package_bases = true
exclude = ["^data/"]  # downloaded third-party code (TAB's evaluation.py)
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["presidio_analyzer.*", "transformers.*", "torch.*", "gliner.*", "opf.*", "spacy.*"]
ignore_missing_imports = true  # optional extra, absent in CI

[tool.interrogate]
fail-under = 60
ignore-init-method = true
ignore-magic = true
ignore-module = true
exclude = ["data", "tests"]  # downloaded third-party code; test names are their docs
verbose = 0

[tool.pytest.ini_options]
testpaths = ["tests"]
