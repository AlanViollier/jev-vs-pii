name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Quality gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      ## Single source of truth: every hook in .pre-commit-config.yaml runs here,
      ## including the local `make check` hook (lint, lint-slop,
      ## mypy, pytest). If a contributor bypassed local pre-commit with --no-verify,
      ## CI catches it.
      - name: Run all pre-commit hooks
        run: uv run pre-commit run --all-files --show-diff-on-failure

      ## CVE scan against PyPI advisory DB. Separate step (not in pre-commit)
      ## because it needs network. `make audit` runs the same thing locally.
      ## Ignores: PYSEC-2022-42969 (py library abandoned, no fix coming).
      - name: Audit dependencies for known CVEs
        run: uv run pip-audit --skip-editable --ignore-vuln PYSEC-2022-42969
