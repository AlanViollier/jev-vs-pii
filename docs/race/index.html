document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"99d78db1-9ba2-4e51-adcc-547ac29eed34\"><\u002Fscript>\n<script id=\"race-data\">window.RACE_DATA=[{\"ds\":\"tab\",\"id\":\"001-61807\",\"text\":\"PROCEDURE\\n\\nThe case originated in an application (no. 36110/97) against the Republic of Turkey lodged with the European Commission of Human Rights (“the Commission”) under former Article 25 of the Convention for the Protection of Human Rights and Fundamental Freedoms (“the Convention”) by four Turkish nationals, Mr Galip Yalman, Mr Bahattin Sarısoy, Mr Osman Çağlayan and Mr Yusuf Çamca (“the applicants”), on 29 November 1996.\\n\\nThe applicants were represented by Mr S. Esmer, a lawyer practising in Ankara. The Turkish Government (“the Government”) did not designate an Agent for the purposes of the proceedings before the Convention institutions.\\n\\nThe applicants alleged that their case, which commenced in 1989 and terminated in 1996, was not heard within a reasonable time as required by the Convention.\\n\\nThe application was transmitted to the Court on 1 November 1998, when Protocol No. 11 to the Convention came into force (Article 5 § 2 of Protocol No. 11).\\n\\nThe application was allocated to the Second Section of the Court (Rule 52 § 1 of the Rules of Court). Within that Section, the Chamber that would consider the case (Article 27 § 1 of the Convention) was constituted as provided in Rule 26 § 1.\\n\\nOn 1 November 2001 the Court changed the composition of its Sections (Rule 25 § 1). This case was assigned to the newly composed First Section (Rule 52 § 1).\\n\\nBy a decision of 15 May 2003, the Court declared the application admissible.\\n\\nThe applicants and the Government each filed observations on the merits (Rule 59 § 1).\\n\\nTHE FACTS\\n\\nIn September 1980 the applicants were taken into police custody and were subsequently placed in detention on remand on suspicion of membership of an illegal organisation. The Erzincan Military Public Prosecutor filed a bill of indictment with the Erzincan Martial Law Court (sıkıyönetim askeri mahkemesi) charging the applicants under Article 146 of the Criminal Code with membership of an illegal organisation whose object was to undermine the constitutional order.\\n\\nOn various dates between 1982 and 1984 the applicants were released pending trial.\\n\\nOn 13 September 1988 the Erzincan Martial Law Court acquitted the applicants of the charges against them.\\n\\nOn various dates in March, April and June 1989 the applicants brought individual actions before the Sinop Assize Court against the Treasury, pursuant to Law no. 466. They requested compensation for their unjustified detention on remand.\\n\\nOn 20 October 1989 the court decided to join the applicants’ cases.\\n\\nOn 15 December 1993 the Sinop Assize Court awarded non‑pecuniary compensation to the applicants. The applicants appealed, arguing that the amount of compensation awarded was not sufficient.\\n\\nOn 31 January 1995 the Court of Cassation quashed the judgment of the first instance court.\\n\\nOn 6 June 1995 the Sinop Assize Court increased the amount of non‑pecuniary compensation.\\n\\nOn 15 June 1995 the applicants again appealed.\\n\\nOn 30 May 1996 the Court of Cassation dismissed the applicants’ appeal and upheld the judgment of the assize court.\",\"w\":[0,9,2,3,1,4,1,10,1,2,1,2,1,11,2,2,2,8,2,7,1,3,1,8,1,2,1,6,1,6,1,4,1,3,1,8,1,10,1,2,1,5,1,6,3,3,1,10,3,5,1,6,1,7,1,2,1,2,1,3,1,10,1,3,1,3,1,10,1,2,1,5,1,6,1,3,1,11,1,8,3,3,1,10,3,2,1,4,1,7,1,9,2,2,1,5,1,6,2,2,1,8,1,7,2,2,1,5,1,8,1,3,1,2,1,5,1,5,3,3,1,10,4,2,1,2,1,8,1,4,3,3,1,10,1,4,1,11,1,2,1,2,1,1,2,5,2,1,1,6,1,10,1,2,1,6,2,3,1,7,1,10,3,3,1,10,3,3,1,3,1,9,1,2,1,5,1,3,1,3,1,8,1,2,1,3,1,11,1,6,1,3,1,10,1,12,3,3,1,10,1,7,1,4,1,5,1,4,2,5,1,9,1,2,1,4,1,3,1,10,1,2,1,4,2,3,1,3,1,5,1,6,1,1,1,10,1,4,1,2,1,8,1,2,1,3,1,10,3,3,1,11,1,3,1,11,1,2,1,3,1,5,1,2,1,1,1,8,1,4,2,4,1,8 \\\"DATETIME\\\"}, {\\\"text\\\": \\\"March, April and June 1989\\\", \\\"type\\\": \\\"DATETIME\\\"}, {\\\"text\\\": \\\"Sinop Assize Court\\\", \\\"type\\\": \\\"OTHER\\\"}, {\\\"text\\\": \\\"Law no. 466\\\", \\\"type\\\": \\\"OTHER\\\"}, {\\\"text\\\": \\\"20 October 1989\\\", \\\"type\\\": \\\"DATETIME\\\"}, {\\\"text\\\": \\\"15 December 1993\\\", \\\"type\\\": \\\"DATETIME\\\"}, {\\\"text\\\": \\\"31 January 1995\\\", \\\"type\\\": \\\"DATETIME\\\"}, {\\\"text\\\": \\\"6 June 1995\\\", \\\"type\\\": \\\"DATETIME\\\"}, {\\\"text\\\": \\\"15 June 1995\\\", \\\"type\\\": \\\"DATETIME\\\"}, {\\\"text\\\": \\\"30 May 1996\\\", \\\"type\\\": \\\"DATETIME\\\"}]}\",\"tp\":64,\"fp\":22,\"fn\":13,\"lat\":3.7289951250422746,\"cost\":0.004268}},{\"ds\":\"tab\",\"id\":\"001-61253\",\"text\":\"PROCEDURE\\n\\nThe case originated in two applications (nos. 43185/98 and 43186/98) against the United Kingdom of Great Britain and Northern Ireland lodged with the European Commission of Human Rights (“the Commission”) under former Article 25 of the Convention for the Protection of Human Rights and Fundamental Freedoms (“the Convention”) by two United Kingdom nationals, John Harding Price (introduced on 4 May 1998) and Mary Hazel Lowe (introduced on 12 August 1998).\\n\\nThe United Kingdom Government (“the Government”) were represented by their Agent, Mr C.A. Whomersley of the Foreign and Commonwealth Office.\\n\\nThe applicants alleged that the proceedings in which they were sued in respect of property in Florida were not dealt with within a reasonable time.\\n\\nThe applications were transmitted to the Court on 1 November 1998, when Protocol No. 11 to the Convention came into force (Article 5 § 2 of Protocol No. 11).\\n\\nThe applications were allocated to the Third Section of the Court (Rule 52 § 1 of the Rules of Court). Within that Section, the Chamber that would consider the case (Article 27 § 1 of the Convention) was constituted as provided in Rule 26 § 1.\\n\\nOn 1 November 2001 the Court changed the composition of its Sections (Rule 25 § 1). This case was assigned to the newly composed Second Section (Rule 52 § 1).\\n\\nBy a decision of 3 September 2002 the Court declared the applications partly admissible, having in the meantime joined them on 28 November 2000.\\n\\nThe applicant and the Government each filed observations on the merits (Rule 59 § 1).\\n\\nTHE FACTS\\n\\nTHE CIRCUMSTANCES OF THE CASE\\n\\nThe applicants were born in 1929 and 1923 respectively. The applicant in application no. 43185/98 (“Dr Price”) is a consultant psychiatrist; the applicant in application no. 43186/98 (“Mrs Lowe”) is a medical secretary. They live in Lincoln.\\n\\nThe applicants, together with Dr Price’s wife, were sued by “K”, a former patient of Dr Price, in respect of property in Florida. The writ was issued on 12 February 1986. Before the action came to trial, the plaintiff was adjudicated bankrupt on 9 August 1989 and the trustee in bankruptcy continued the action.\\n\\nThe trial was set down to commence in the High Court in August 1994 but was postponed until the end of September 1994 because the judge was not available for the length of time needed for the hearing.\\n\\nOn the fourth day of trial, while K was being cross-examined, an adjournment was granted because K claimed to feel unwell. In the event, it emerged that no medical justification could be given for his continued non-attendance, but nonetheless he remained absent for the rest of the trial. Because of the delay caused by K’s non-attendance, the trial could not be concluded in September 1994 and had to be adjourned until January 1995. Judgment was given on 27 April 1995.\\n\\nThe judge accepted the argument of the applicants and Mrs Price that it was necessary to disregard K’s evidence because of his failure to remain for cross-examination. However, on the basis of the documentary evidence and that adduced by the applicants and Mrs Price, the judge found that the transfer of the Florida property should be set aside on the ground that the defendants had not been able to rebut the presumption of undue influence created by the discrepancy in the price they paid K for the property and its value at the time of the transfer, together with the doctor-patient relationship between Dr Price and K.\\n\\nThe formal record of the judge’s order was not prepared by the parties until 26 October 1995. The applicants and Mrs Price applied to the Court of Appeal for leave to appeal on 1 November 1995. The appeal bundles were lodged on 4 October 1996. On 15 January 1997 the appeal was listed for hearing, and it was heard on 16 and 17 April 1997, on which last date the Court of Appeal gave judgment dismissing the appeal.\\n\\nIn connection with the moneys paid by Dr Price for the property, the Court of Appeal confirmed the decision of the trial judge that the sum should be repaid, but that no interest should be paid on it. The trial judge had based his decision on the fact that Dr Price “had had possession of the properties and receipt of the rents since the completion of the sale, subject only to the agreement to allow [K] to use number 212 in the early months”. Lord Justice Nourse regarded this as a “rough and ready result”, but one which would “reduce the opportunities for further dispute between the parties”.\\n\\nOn 19 April 1997 the applicants and Mrs Price were refused leave by the Court of Appeal to appeal to the House of Lords. On 30 March 1998 the applicants and Mrs Price were refused leave to appeal by the House of Lords.\",\"w\":[0,9,2,3,1,4,1,10,1,2,1,3,1,12,2,3,2,8,1,3,1,8,2,7,1,3,1,6,1,7,1,2,1,5,1,7,1,3,1,8,1,7,1,6,1,4,1,3,1,8,1,10,1,2,1,5,1,6,3,3,1,10,3,5,1,6,1,7,1,2,1,2,1,3,1,10,1,3,1,3,1,10,1,2,1,5,1,6,1,3,1,11,1,8,3,3,1,10,3,2,1,3,1,6,1,7,1,9,2,4,1,7,1,5,2,10,1,2,1,1,1,3,1,4,2,3,1,4,1,5,1,4,2,10,1,2,1,2,1,6,1,4,4,3,1,6,1,7,1,10,3,3,1,10,3,4,1,11,1,2,1,5,1,5,2,2,1,3,2,10,1,2,1,3,1,7,1,3,1,12,1,6,3,3,1,10,1,7,1,4,1,3,1,11,1,2,1,5,1,4,1,4,1,4,1,2,1 \\": \\\"27 April 1995\\\", \\\"type\\\": \\\"DATETIME\\\"}, {\\\"text\\\": \\\"26 October 1995\\\", \\\"type\\\": \\\"DATETIME\\\"}, {\\\"text\\\": \\\"1 November 1995\\\", \\\"type\\\": \\\"DATETIME\\\"}, {\\\"text\\\": \\\"4 October 1996\\\", \\\"type\\\": \\\"DATETIME\\\"}, {\\\"text\\\": \\\"15 January 1997\\\", \\\"type\\\": \\\"DATETIME\\\"}, {\\\"text\\\": \\\"16 and 17 April 1997\\\", \\\"type\\\": \\\"DATETIME\\\"}, {\\\"text\\\": \\\"19 April 1997\\\", \\\"type\\\": \\\"DATETIME\\\"}, {\\\"text\\\": \\\"30 March 1998\\\", \\\"type\\\": \\\"DATETIME\\\"}, {\\\"text\\\": \\\"212\\\", \\\"type\\\": \\\"LOCATION\\\"}]}\",\"tp\":78,\"fp\":27,\"fn\":26,\"lat\":4.353264416800812,\"cost\":0.005087}},{\"ds\":\"tab\",\"id\":\"001-66929\",\"text\":\"PROCEDURE\\n\\nThe case originated in an application (no. 42552/98) against the Republic of Turkey lodged with the European Commission of Human Rights (“the Commission”) under former Article 25 of the Convention for the Protection of Human Rights and Fundamental Freedoms (“the Convention”) by Turkish nationals, Mr Mehmet Bülent Yılmaz and Mr Şahin Yılmaz (“the applicants”), on 20 May 1998.\\n\\nThe applicants, who had been granted legal aid, were represented by Mr H.Ç. Akbulut, a lawyer practising in Izmir. The Turkish Government (“the Government”) did not designate an Agent for the purpose of the proceedings before the Court.\\n\\nOn 21 March 2002 the Court decided to communicate the application to the Government. Under the provisions of Article 29 § 3 of the Convention, it decided to examine the merits of the application at the same time as its admissibility.\\n\\nTHE FACTS\\n\\nI. THE CIRCUMSTANCES OF THE CASE\\n\\nThe applicants were born in 1975 and 1970 respectively.\\n\\nOn 19 and 20 August 1995 respectively the applicants were taken into custody by police officers from the Anti-Terrorism Department of the Aydın Security Directorate on suspicion of their membership to an illegal organisation, namely the DHKP/C.\\n\\nIn their police statements the applicants accepted the accusations against them.\\n\\nOn 22 August 1995 the applicants were brought before the investigating judge at the Aydın Magistrate’s Court, where they repeated the statements they had made to the police. The investigating judge ordered that they be placed in detention on remand.\\n\\nIn an indictment dated 6 September 1995, the public prosecutor at the Izmir State Security Court initiated criminal proceedings against the applicants. He charged the first applicant with being member of an armed gang under Article 168 § 2 of the Criminal Code and the second applicant with aiding and abetting an armed gang under Article 169 of the Criminal Code.\\n\\nDuring the hearings before the Izmir State Security Court, the applicants denied the statements they had made to the police and the investigating judge.\\n\\nOn 25 March 1997 the Izmir State Security Court, composed of two civilian judges and a military judge, convicted the applicants as charged and sentenced the first applicant to three years and nine months’ imprisonment and the second applicant to twelve years and six months’ imprisonment. Neither the applicants nor their lawyers were present in this last hearing.\\n\\nThe applicants appealed. On 12 November 1997 the Court of Cassation dismissed the applicants’ appeal, upholding the Izmir State Security Court’s reasoning and assessment of evidence. The decision, which was pronounced in the absence of the applicants and their lawyers, was deposited with the Registry of the Izmir State Security Court on 21 November 1997.\",\"w\":[0,9,2,3,1,4,1,10,1,2,1,2,1,11,2,2,2,8,2,7,1,3,1,8,1,2,1,6,1,6,1,4,1,3,1,8,1,10,1,2,1,5,1,6,3,3,1,10,3,5,1,6,1,7,1,2,1,2,1,3,1,10,1,3,1,3,1,10,1,2,1,5,1,6,1,3,1,11,1,8,3,3,1,10,3,2,1,7,1,9,2,2,1,6,1,6,1,6,1,3,1,2,1,5,1,6,3,3,1,10,4,2,1,2,1,3,1,4,3,3,1,10,2,3,1,3,1,4,1,7,1,5,1,3,2,4,1,11,1,2,1,2,1,3,2,7,2,1,1,6,1,10,1,2,1,5,2,3,1,7,1,10,3,3,1,10,3,3,1,3,1,9,1,2,1,5,1,3,1,3,1,7,1,2,1,3,1,11,1 \"fn\":3,\"lat\":3.206757792038843,\"cost\":0.003613}},{\"ds\":\"tab\",\"id\":\"001-159913\",\"text\":\"PROCEDURE\\n\\nThe case originated in an application (no. 5136/11) against the Republic of Poland lodged with the Court under Article 34 of the Convention for the Protection of Human Rights and Fundamental Freedoms (“the Convention”) by a Polish national, Mr Kamil Prus (“the applicant”), on 6 December 2010.\\n\\nThe applicant, who had been granted legal aid, was represented by Mr S. Kotuła, a lawyer practising in Lublin. The Polish Government (“the Government”) were represented by their Agent, Ms J. Chrzanowska, of the Ministry of Foreign Affairs.\\n\\nThe applicant alleged, in particular, a breach of Article 3 of the Convention on account of the imposition on him of the so-called “dangerous detainee” regime.\\n\\nOn 7 July 2014 the application was communicated to the Government.\\n\\nTHE FACTS\\n\\nI. THE CIRCUMSTANCES OF THE CASE\\n\\nThe applicant was born in 1987 and is detained in Lublin.\\n\\nA. Criminal proceedings against the applicant\\n\\nOn 1 December 2005 the applicant was arrested and remanded in custody. In 2006 he was convicted of three counts of battery and robbery and received prison sentences ranging from two to four years. On 28 November 2006 the Lublin Regional Court imposed a cumulative sentence for four criminal convictions.\\n\\nB. Imposition of the so-called “dangerous detainee” regime\\n\\nOn 5 November 2010 the Opole Lubelskie Prison Penitentiary Commission imposed on the applicant the so-called “dangerous detainee” regime. The commission held that the applicant had been the leader of or an active participant in a planned collective remonstrance in Opole Lubelskie Prison (Article 88a § 2 (2a) of the Code of Execution of Criminal Sentences), as the detainees refused to accept food provided by the prison authorities. The authorities learned that the detainees were planning another collective protest for 11 November 2010. The commission also considered that the applicant was particularly depraved.\\n\\nOn 18 January 2011 the Opole Lubelskie Prison Penitentiary Commission rejected an appeal lodged by the applicant and dismissed his request for leave to examine the appeal outside the statutory time-limit.\\n\\nSubsequently, the applicant was transferred to the Lublin Remand Centre.\\n\\nOn 3 February 2011 the Lublin Remand Centre Penitentiary Commission reviewed and upheld the decision to apply the regime to the applicant, considering that he posed a serious threat to the security of the detention centre. The applicant appealed.\\n\\nOn 4 April 2011 the Lublin Regional Court dismissed the appeal. The court referred to the reasons given in the decision of 5 November 2010, holding that the decision had been lawful and justified.\\n\\nOn 3 March 2011 the applicant lodged a complaint with the Lublin Regional Inspectorate of Prisons. He complained that he was having difficulties in accessing educational activities in the Lublin Remand Centre. The authorities dismissed the complaint, holding that educational activities were not organised for dangerous prisoners.\\n\\nOn an unspecified date in 2011 the applicant notified the police of his allegedly unlawful classification as a “dangerous detainee” on 5 November 2010. He claimed that the Opole Lubelskie Prison authorities had exceeded their powers in imposing the regime on him. On 29 April 2011 the Opole Lubelskie District Prosecutor refused to open an investigation in the case, holding that no offence had been committed.\\n\\nOn 28 April 2011 the Lublin Remand Centre Penitentiary Commission revoked its decision to classify the applicant as a “dangerous detainee”. It considered that the applicant’s behaviour had improved and that he no longer posed a threat to the security of the remand centre.\",\"w\":[0,9,2,3,1,4,1,10,1,2,1,2,1,11,2,2,2,7,2,7,1,3,1,8,1,2,1,6,1,6,1,4,1,3,1,5,1,5,1,7,1,2,1,2,1,3,1,10,1,3,1,3,1,10,1,2,1,5,1,6,1,3,1,11,1,8,3,3,1,10,3,2,1,1,1,6,1,8 \\"text\\\": \\\"5136/11\\\", \\\"type\\\": \\\"ID\\\"}, {\\\"text\\\": \\\"Republic of Poland\\\", \\\"type\\\": \\\"LOCATION\\\"}, {\\\"text\\\": \\\"Mr Kamil Prus\\\", \\\"type\\\": \\\"PERSON\\\"}, {\\\"text\\\": \\\"6 December 2010\\\", \\\"type\\\": \\\"DATETIME\\\"}, {\\\"text\\\": \\\"Mr S. Kotuła\\\", \\\"type\\\": \\\"PERSON\\\"}, {\\\"text\\\": \\\"Lublin\\\", \\\"type\\\": \\\"LOCATION\\\"}, {\\\"text\\\": \\\"Ms J. Chrzanowska\\\", \\\"type\\\": \\\"PERSON\\\"}, {\\\"text\\\": \\\"Ministry of Foreign Affairs\\\", \\\"type\\\": \\\"OTHER\\\"}, {\\\"text\\\": \\\"1987\\\", \\\"type\\\": \\\"DATETIME\\\"}, {\\\"text\\\": \\\"Lublin\\\", \\\"type\\\": \\\"LOCATION\\\"}, {\\\"text\\\": \\\"1 December 2005\\\", \\\"type\\\": \\\"DATETIME\\\"}, {\\\"text\\\": \\\"2006\\\", \\\"type\\\": \\\"DATETIME\\\"}, {\\\"text\\\": \\\"28 November 2006\\\", \\\"type\\\": \\\"DATETIME\\\"}, {\\\"text\\\": \\\"Lublin Regional Court\\\", \\\"type\\\": \\\"OTHER\\\"}, {\\\"text\\\": \\\"5 November 2010\\\", \\\"type\\\": \\\"DATETIME\\\"}, {\\\"text\\\": \\\"Opole Lubelskie Prison Penitentiary Commission\\\", \\\"type\\\": \\\"OTHER\\\"}, {\\\"text\\\": \\\"Opole Lubelskie Prison\\\", \\\"type\\\": \\\"LOCATION\\\"}, {\\\"text\\\": \\\"11 November 2010\\\", \\\"type\\\": \\\"DATETIME\\\"}, {\\\"text\\\": \\\"18 January 2011\\\", \\\"type\\\": \\\"DATETIME\\\"}, {\\\"text\\\": \\\"Lublin Remand Centre\\\", \\\"type\\\": \\\"LOCATION\\\"}, {\\\"text\\\": \\\"3 February 2011\\\", \\\"type\\\": \\\"DATETIME\\\"}, {\\\"text\\\": \\\"Lublin Remand Centre Penitentiary Commission\\\", \\\"type\\\": \\\"OTHER\\\"}, {\\\"text\\\": \\\"4 April 2011\\\", \\\"type\\\": \\\"DATETIME\\\"}, {\\\"text\\\": \\\"3 March 2011\\\", \\\"type\\\": \\\"DATETIME\\\"}, {\\\"text\\\": \\\"Lublin Regional Inspectorate of Prisons\\\", \\\"type\\\": \\\"OTHER\\\"}, {\\\"text\\\": \\\"2011\\\", \\\"type\\\": \\\"DATETIME\\\"}, {\\\"text\\\": \\\"29 April 2011\\\", \\\"type\\\": \\\"DATETIME\\\"}, {\\\"text\\\": \\\"Opole Lubelskie District Prosecutor\\\", \\\"type\\\": \\\"OTHER\\\"}, {\\\"text\\\": \\\"28 April 2011\\\", \\\"type\\\": \\\"DATETIME\\\"}]}\",\"tp\":101,\"fp\":7,\"fn\":12,\"lat\":3.942468333058059,\"cost\":0.004507}},{\"ds\":\"tab\",\"id\":\"001-61227\",\"text\":\"PROCEDURE\\n\\nThe case originated in an application (no. 57836/00) against the United Kingdom of Great Britain and Northern Ireland lodged with the Court under Article 34 of the Convention for the Protection of Human Rights and Fundamental Freedoms (“the Convention”) by a United Kingdom national, Mr Spencer James Mellors (“the applicant”), on 12 January 2000.\\n\\nThe applicant, who had been granted legal aid, was represented by Mr J. Carroll, a lawyer practising in Glasgow. The United Kingdom Government (“the Government”) were represented by their Agent, Mr C. Whomersley of the Foreign and Commonwealth Office, London.\\n\\nThe applicant alleged that his criminal proceedings exceeded a reasonable time contrary to Article 6 § 1 of the Convention.\\n\\nThe application was allocated to the Third Section of the Court (Rule 52 § 1 of the Rules of Court). Within that Section, the Chamber that would consider the case (Article 27 § 1 of the Convention) was constituted as provided in Rule 26 § 1.\\n\\nOn 19 June 2001, the Court rejected part of the application as inadmissible.\\n\\nOn 1 November 2001, the Court changed the composition of its sections (Rule 25 § 1). This case was assigned to the newly composed Third Section.\\n\\nBy a final decision of 30 January 2003, the Court declared the application partly admissible.\\n\\nThe applicant and the Government each filed observations on the merits (Rule 59 § 1). The Chamber decided, after consulting the parties, that no hearing on the merits was required (Rule 59 § 3 in fine).\\n\\nTHE FACTS\\n\\nThe applicant was born in 1964 and is currently serving a sentence of imprisonment in HM Prison Craiginches, Aberdeen.\\n\\nThe applicant was arrested on a charge of attempted murder arising out of a high speed car chase which occurred in the early hours of 29 October 1995. On 30 October 1995, he was arrested again, interviewed and cautioned in respect of a separate incident of rape and assault which also occurred during the early morning of 29 October 1995.\\n\\nOn 31 October 1995, the applicant appeared in court in respect of the various road traffic offences and the attempted murder of a police officer. On 7 November 1995, he was fully committed and remanded in custody on those charges (of which he was later acquitted).\\n\\nOn 30 November 1995, the applicant appeared before the Sheriff and was committed in respect of the rape charge.\\n\\nOn 24 June 1996, the trial began in the High Court. On 2 July 1996, the applicant was convicted, by a majority verdict, of all charges and sentenced to 9 years 9 months' imprisonment.\\n\\nOn 8 July 1996, the applicant lodged an intention to appeal with the High Court sitting as an appeal court. On 20 August 1996, a Note of Appeal was lodged.\\n\\nOn 26 September 1996, a single judge refused the appeal. The applicant appealed.\\n\\nOn 31 October 1996, the Note of Appeal was allowed by three judges in restricted terms relating to the direction given by the trial judge on the special defence of alibi.\\n\\nOn 20 December 1996, the appeal was set down to be heard. According to the Government, it did not take place as the applicant refused to leave prison. The applicant stated that contrary to statutory authority the prison governor refused to allow him to leave the prison wearing civilian clothes instead of a prison uniform for the hearing. A further hearing was fixed for 22 May 1997. On that date, the Crown requested, and obtained, an adjournment as the Advocate Depute was engaged abroad.\\n\\nOn 19 November 1997, the appeal was set down to be heard. It was discontinued due to lack of court time and pressure of other business. It was noted that the appeal was complex and would last half a day.\\n\\nOn 13 and 14 January 1998, there was another appeal hearing. As the applicant's solicitor had become aware that the prosecution had never cited a witness, W. to appear at the trial, he had lodged and argued an additional ground of appeal on this point. Following argument, he sought to lodge further additional grounds of appeal. The appeal was continued to 13 February 1998 to enable him to do so.\\n\\nOn 13 February 1998, the High Court held that the failure to hear the evidence of W. resulted in unfairness and that further evidence should be heard. Lord Philip was designated as the judge to hear the evidence. On 28 May 1998, he fixed a date to take the evidence of W. On 20 August 1998, the hearing was adjourned as the applicant's counsel withdrew from acting on his behalf.\\n\\nOn 16 October 1998, W. gave evidence. In his note of 20 November 1998, Lord Philip gave his view of the credibility and reliability of W. The appeal was relisted for hearing on 8 January 1999 but the applicant's solicitors wrote to the court requesting that another date, possibly in the following week, be fixed due to the unavailability of counsel.\\n\\nOn 24 June 1999, the appeal was heard before the High Court.\\n\\nOn 22 July 1999, the judgment of the court was given by the Lord Justice General, Lord Rodger. It dismissed the applicant's appeal.\",\"w\":[0,9,2,3,1,4,1,10,1,2,1,2,1,11,2,2,2,8,2,7,1,3,1,6,1,7,1,2,1,5,1,7,1,3,1,8,1,7,1,6,1,4,1,3,1,5,1,5,1,7,1,2,1,2,1,3,1,10,1,3,1,3,1,10,1,2,1,5,1,6,1,3,1,11,1,8,3,3,1,10,3,2,1,1,1,6,1,7,1,8,2,2,1,7,1,5,1,7,3,3,1,9,4,2,1,2,1,7,1,4,3,3,1,9,2,3,1,3,1,4,1,7,1,5,1,3,2,3,1,11,1,2,1,2,1,1,2,7,2,1,1,6,1,10,1,2,1,7,2,3,1,6,1,7,1,10,3,3,1,10,3,4,1,11,1,2,1,5,1,5,2,2,1,1,2,10,1,2,1,3,1,7,1,3,1,12,1,6,2,6,3,3,1,9,1,7,1,4,1,3,1,8,1,11,1,8,1,1,1,10,1,4,1,8,1,2,1,7,1,1,3,1,1,2,1,3,1,10,3,3,1,11,1,3,1,9,1,2,1,3,1,5,1,7,1,2,1,3,1,5,2,4,1,2,3,1,1,2,1,3,1,5,1,2,1,5,3,6,1,4,1,7,2,3,1,7,1,4,1,5,1,8,1,3,1,4,2,7,1,2,3,1,1,2,1,3,1,10,2,3,1,11,1,2,1,8,1, is accessible at https://eac.gov/voting-where-i-live/state-election-offices#Election-Management-Plan. Maria, who is 34 years old, will be responsible for ensuring that all voter registration processes are smoothly executed. The primary objective of the plan is to ensure a fair and transparent election process.\\n\\nVoter registration is a critical component of the election management plan. All eligible voters must register by 2024-07-15 to participate in the election. Maria2001, the designated voter registration officer, will handle all registration activities, ensuring that every voter is accurately registered. The registration process will be conducted in Tagalog to ensure that all voters can understand and complete the necessary forms.\\n\\nPolling station management is another key aspect of the plan. Each polling station will be equipped with necessary materials and staffed by trained personnel to handle the voting process efficiently. The ballot counting procedures will be meticulously followed to ensure accuracy and transparency. Contingency plans are in place to address any potential issues that may arise during the voting process. These plans include backup power supplies, additional staff, and emergency communication protocols.\\n\\nIn the event of any issues or concerns, voters can contact Maria at votepro.mt@votera.com.ph for assistance. The password for accessing the election management portal is P@ssw0rdP@ssw0rd. This ensures that only authorized personnel can access and manage the election data. The plan aims to provide a seamless and secure voting experience for all citizens of Tagbilaran, Bohol.\",\"w\":[0,3,1,8,1,10,1,4,1,3,1,3,1,11,2,12,1,3,1,3,1,4,1,2,1,10,2,5,2,8,1,3,1,13,1,10,1,3,1,10,1,3,1,10,1,1,1,10,1,8,2,3,1,4,1,2,1,8,1,2,1,5,2,5,1,5,1,2,1,24,2,3,1,2,1,10,1,2,1,83,2,5,2,3,1,2,1,2,1,5,1,3,2,4,1,2,1,11,1,3,1,8,1,4,1,3,1,5,1,12,1,9,1,3,1,8,1,8,2,3,1,7,1,9,1,2,1,3,1,4,1,2,1,2,1,6,1,1,1,4,1,3,1,11,1,8,1,7,3,5,1,12,1,2,1,1,1,8,1,9,1,2,1,3,1,8,1,10 ARD<\u002Fdiv>\n        <div style=\"font-size:11px;color:#9C9384;\">{{ scoreNote }}<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"overflow-x:auto;\">\n        <div style=\"min-width:1140px;display:flex;flex-direction:column;font-size:12px;font-variant-numeric:tabular-nums;\">\n          <div style=\"display:grid;grid-template-columns:180px repeat(10,minmax(88px,1fr));gap:8px;white-space:nowrap;padding:6px 8px;color:#9C9384;font-size:11px;border-bottom:1px solid #3A332C;\">\n            <span>document<\u002Fspan>\n            <span style=\"color:#d95926;text-align:right;\">F2 Jev<\u002Fspan><span style=\"color:#3987e5;text-align:right;\">F2 Haiku<\u002Fspan><span style=\"text-align:right;\">F2 lead<\u002Fspan>\n            <span style=\"color:#d95926;text-align:right;\">time Jev<\u002Fspan><span style=\"color:#3987e5;text-align:right;\">time Haiku<\u002Fspan><span style=\"text-align:right;\">faster by<\u002Fspan>\n            <span style=\"color:#d95926;text-align:right;\">leaked Jev<\u002Fspan><span style=\"color:#3987e5;text-align:right;\">leaked Haiku<\u002Fspan>\n            <span style=\"color:#d95926;text-align:right;\">cost Jev<\u002Fspan><span style=\"color:#3987e5;text-align:right;\">cost Haiku<\u002Fspan>\n          <\u002Fdiv>\n          <sc-for list=\"{{ rows }}\" as=\"r\" hint-placeholder-count=\"10\">\n            <div sc-camel-on-click=\"{{ r.pick }}\" style=\"{{ r.style }}\">\n              <span style=\"display:flex;gap:8px;\"><span style=\"color:#EDE6D8;font-weight:600;\">{{ r.num }}<\u002Fspan><span style=\"color:#9C9384;\">{{ r.kind }}<\u002Fspan><\u002Fspan>\n              <span style=\"{{ r.fjS }}\">{{ r.fj }}<\u002Fspan><span style=\"{{ r.fhS }}\">{{ r.fh }}<\u002Fspan><span style=\"{{ r.leadS }}\">{{ r.lead }}<\u002Fspan>\n              <span style=\"{{ r.tjS }}\">{{ r.tj }}<\u002Fspan><span style=\"{{ r.thS }}\">{{ r.th }}<\u002Fspan><span style=\"{{ r.fastS }}\">{{ r.fast }}<\u002Fspan>\n              <span style=\"{{ r.ljS }}\">{{ r.lj an>\n    <span style=\"display:flex;align-items:center;gap:8px;\"><span style=\"width:20px;height:2px;background:#d55181;\"><\u002Fspan>leaked<\u002Fspan>\n    <span style=\"display:flex;align-items:center;gap:8px;\"><span style=\"width:20px;height:10px;background:rgba(201,133,0,0.25);outline:1px solid #6b5420;\"><\u002Fspan>personal info (answer key)<\u002Fspan>\n    <span style=\"display:flex;align-items:center;gap:8px;\"><span style=\"display:flex;gap:2px;\"><sc-for list=\"{{ rampSw }}\" as=\"c\" hint-placeholder-count=\"5\"><span style=\"{{ c }}\"><\u002Fspan><\u002Fsc-for><\u002Fspan>Jev's p(personal), low → masks at 0.40<\u002Fspan>\n    <span style=\"display:flex;align-items:center;gap:8px;\"><span style=\"width:10px;height:10px;background:#A39C91;\"><\u002Fspan>never asked<\u002Fspan>\n  <\u002Ffooter>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;pScale&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;cool-warm&quot;,&quot;orange&quot;],&quot;default&quot;:&quot;cool-warm&quot;,&quot;tsType&quot;:&quot;'cool-warm' | 'orange'&quot;,&quot;section&quot;:&quot;Jev probability&quot;},&quot;fontSize&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:13,&quot;min&quot;:11,&quot;max&quot;:18,&quot;unit&quot;:&quot;px&quot;,&quot;tsType&quot;:&quot;number&quot;}}\">\nconst INK = '#1C1A17', GREY = '#A39C91', RED = '#d55181', JEV = '#d95926', HAI = '#3987e5';\nconst JK = 'decision_fields_skip:jev', HK = 'llm_sayback:haiku4.5';\nconst THR = 0.4, COOL = '#4F6B8A', SKIP = '#A39C91';\nconst rampColor = (p, mode) => { const k = Math.min(1, p / THR) * 100; return 'color-mix(in oklab, ' + JEV + ' ' + k.toFixed(0) + '%, ' + (mode === 'orange' ? '#1C1A17' : COOL) + ')'; };\nconst INTRO = 1.6, HOLD = 2.6, FINAL = 6;\nconst f2 = L => { const d = 5 * L.tp + 4 * L.fn + L.fp; return d ? 5 * L.tp / d : 1; };\nconst bits = s => Array.from(s, c => c === '1');\nconst pad = n => String(n).padStart(2, '0');\nfunction decode(raw) {\n  return raw.map(r => {\n    const words = []; let pos = 0;\n    for (let i = 0; i < r.w.length; i += 2) { const s = pos + r.w[i], e = s + r.w[i + 1]; words.push([s, e]); pos = e; }\n    const lane = (x, extra) => ({ masked: bits(x.m), tp: x.tp, fp: x.fp, fn: x.fn, latency_s: x.lat, cost_usd: x.cost, ...extra });\n    return {\n      dataset: r.ds, doc_id: r.id, text: r.text, words, gold_words: bits(r.g),\n      lanes: { [JK]: lane(r.J, { asked: bits(r.J.a), p_pii: r.J.p.map(v => v / 100) }), [HK]: lane(r.H, { answer: r.H.ans }) },\n    };\n  });\n}\n\nclass Component extends DCLogic {\n  state = { data: null, doc: 0, slow: true, phase: 'idle', mode: 'single', v: 0, tally: {} };\n  t = 0; phase = 'idle'; mode = 'single'; slow = true; counts = null; cache = { J: [], H: [], B: [] };\n  jevRef = React.createRef(); haiRef = React.createRef(); stripRef = React.createRef();\n  readoutRef = React.createRef(); introBar = React.createRef();\n  prep = {};\n\n  componentDidMount() {\n    this.auto = /[?&]autoplay(=|&|$)/.test(location.search);\n    window.addEventListener('keydown', this.onKey);\n    const go = () => {\n      if (!window.RACE_DATA) { this.poll = setTimeout(go, 50); return; }\n      const data = decode(window.RACE_DATA);\n      this.setState({ data }, () => { if (this.auto) { this.slow = false; this.setState({ slow: false }); this.playAll(); } });\n    };\n    go();\n  }\n  componentWillUnmount() { cancelAnimationFrame(this.raf); clearTimeout(this.poll); window.removeEventListener('keydown', this.onKey); }\n  onKey = e => {\n    if (e.target && /INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;\n    if (e.key === 'ArrowRight') this.nav(1); else if (e.key === 'ArrowLeft') this.nav(-1);\n  };\n  nav(dir) { if (!this.state.data) return; const n = this.state.data.length; this.raceDoc((this.state.doc + dir + n) % n); }\n  raceDoc(i) {\n    if (!this.state.data) return;\n    cancelAnimationFrame(this.raf);\n    this.mode = 'single'; this.resetDoc();\n    this.setState({ doc: i, mode: 'single' });\n    this.beginRun(performance.now());\n    this.raf = requestAnimationFrame(this.tick);\n  }\n  componentDidUpdate(pp) {\n    if (pp.pScale !== this.props.pScale) { this.prep = {}; this.cache = { J: [], H: [], B: [] }; this.elsDoc = -1; }\n    this.applyFrame();\n  }\n\n  getPrep(idx) {\n    if (this.prep[idx]) return this.prep[idx];\n    const d = this.state.data[idx], J = d.lanes[JK], H = d.lanes[HK], n = d.words.length;\n    const askedN = J.asked.filter(Boolean).length || 1, step = J.latency_s / askedN;\n    const jStart = [], jEnd = []; let k = 0, last = 0;\n    for (let i = 0; i < n; i++) {\n      if (J.asked[i]) { jStart[i] = k * step; jEnd[i] = (k + 1) * step; last = jEnd[i]; k++; }\n      else { jStart[i] = jEnd[i] = last; }\n    }\n    const ans = H.answer || '';\n    const ends = []; let depth = 0, inStr = false, esc = false;\n    for (let c = 0; c < ans.length; c++) {\n      const ch = ans[c];\n      if (inStr) { if (esc) esc = false; else if (ch === '\\\\') esc = true; else if (ch === '\"') inStr = false; continue; }\n      if (ch === '\"') inStr = true;\n      else if (ch === '{' || ch === '[') depth++;\n      else if (ch === '}' || ch === ']') { if (ch === '}' && depth === 3) ends.push(c); depth--; }\n    }\n    let items = []; try { items = JSON.parse(ans).items || []; } catch (e) {}\n    const hRev = new Array(n).fill(Infinity), hItem = new Array(n).fill(-1);\n    const lowText = d.text.toLowerCase();\n    const itemTimes = items.map((_, j) => ((ends[j] ?? ans.length - 1) + 1) / Math.max(ans.length, 1) * H.latency_s);\n    items.forEach((it, j) => {\n      const s = (it.text || '').trim(); if (!s) return;\n      const time = itemTimes[j];\n      const occ = []; let p = d.text.indexOf(s);\n      while (p >= 0) { occ.push(p); p = d.text.indexOf(s, p + 1); }\n      if (!occ.length) { const ls = s.toLowerCase(); p = lowText.indexOf(ls); while (p >= 0) { occ.push(p); p = lowText.indexOf(ls, p + 1); } }\n      occ.forEach(o => {\n        const e = o + s.length;\n        for (let w = 0; w < n; w++) {\n          const [ws, we] = d.words[w];\n          if (ws < e && we > o && H.masked[w] && time < hRev[w]) { hRev[w] = time; hItem[w] = j; }\n        }\n      });\n    });\n    for (let w = 0; w < n; w++) if (H.masked[w] && hRev[w] === Infinity) hRev[w] = H.latency_s;\n    const segs = []; let prev = 0;\n    d.words.forEach(([s, e], i) => { segs.push({ gap: d.text.slice(prev, s), text: d.text.slice(s, e), i }); prev = e; });\n    const wordsJ = segs.map(s => ({ ...s, bar: true })), wordsH = segs.map(s => ({ ...s, bar: false }));\n    const pCol = J.p_pii.map(v => rampColor(v, this.props.pScale));\n    const p = { pCol, wordsJ, wordsH, d, J, H, n, jStart, jEnd, hRev, hItem, itemTimes, ans, segs, tail: d.text.slice(prev), end: Math.max(J.latency_s, H.latency_s) };\n    this.prep[idx] = p; return p;\n  }\n\n  docLabel(i) {\n    const D = this.state.data; let k = 0;\n    for (let j = 0; j <= i; j++) if (D[j].dataset === D[i].dataset) k++;\n    return (D[i].dataset === 'tab' ? 'court judgment ' : 'business document ') + k + ' · ' + D[i].words.length + ' words';\n  }\n\n  resetScroll() { [this.jevRef, this.haiRef].forEach(r => r.current && (r.current.scrollTop = 0)); }\n  resetDoc() { this.resetScroll(); this.t = 0; this.counts = null; this._fj = this._fh = -1; }\n\n  playAll = () => {\n    cancelAnimationFrame(this.raf);\n    this.mode = 'all';\n    this.setState({ mode: 'all', tally: {} });\n    this.startDoc(0);\n    this.raf = requestAnimationFrame(this.tick);\n  };\n  stopAll = () => {\n    cancelAnimationFrame(this.raf);\n    this.mode = 'single'; this.phase = 'idle'; this.resetDoc();\n    this.setState({ mode: 'single', phase: 'idle' });\n  };\n  startDoc(i) {\n    this.resetDoc(); this.phase = 'intro'; this.phaseStart = performance.now();\n    this.setState({ doc: i, phase: 'intro' });\n  }\n  beginRun(now) {\n    this.phase = 'running'; this.tBase = 0; this.t = 0; this.wallBase = now; this.lastSet = 0;\n    this.setState({ phase: 'running' });\n  }\n  raceOne = () => {\n    if (!this.state.data) return;\n    cancelAnimationFrame(this.raf);\n    this.mode = 'single'; this.resetDoc();\n    this.setState({ mode: 'single' });\n    this.beginRun(performance.now());\n    this.raf = requestAnimationFrame(this.tick);\n  };\n  pickDoc(i) {\n    cancelAnimationFrame(this.raf);\n    this.mode = 'single'; this.phase = 'idle'; this.resetDoc();\n    this.setState({ doc: i, mode: 'single', phase: 'idle' });\n  }\n  closeFinal = () => {\n    cancelAnimationFrame(this.raf);\n    this.mode = 'single'; this.phase = 'done';\n    this.setState({ mode: 'single', phase: 'done' });\n  };\n  setSpeed(slow) {\n    this.tBase = this.t; this.wallBase = performance.now(); this.slow = slow;\n    this.setState({ slow });\n  }\n\n  tick = now => {\n    const next = () => { this.raf = requestAnimationFrame(this.tick); };\n    if (this.phase === 'intro') {\n      const k = (now - this.phaseStart) / 1000 / INTRO;\n      if (this.introBar.current) this.introBar.current.style.width = Math.min(100, k * 100) + '%';\n      if (k >= 1) this.beginRun(now);\n      return next();\n    }\n    if (this.phase === 'running') {\n      const P = this.getPrep(this.state.doc);\n      this.t = this.tBase + Math.max(0, now - this.wallBase) / 1000 * (this.slow ? 0.2 : 1);\n      if (this.t >= P.end) {\n        this.t = P.end; this.phase = 'done'; this.phaseStart = now; this.applyFrame();\n        const lane = L => ({ tp: L.tp, fp: L.fp, fn: L.fn, cost: L.cost_usd });\n        const tally = { ...this.state.tally, [this.state.doc]: { jF2: f2(P.J), hF2: f2(P.H), jLat: P.J.latency_s, hLat: P.H.latency_s, J: lane(P.J), H: lane(P.H) } };\n        this.setState({ phase: 'done', tally, v: now });\n        if (this.mode === 'all') next();\n        return;\n      }\n      this.applyFrame();\n      if (now - this.lastSet > 60) { this.lastSet = now; this.setState({ v: now }); }\n      return next();\n    }\n    if (this.mode !== 'all') return;\n    if (this.phase === 'done') {\n      if (now - this.phaseStart > HOLD * 1000) {\n        if (this.state.doc < this.state.data.length - 1) this.startDoc(this.state.doc + 1);\n        else { this.phase = 'final'; this.phaseStart = now; this.setState({ phase: 'final' }); }\n      }\n      return next();\n    }\n    if (this.phase === 'final') {\n      if (!this.auto) return;\n      if (now - this.phaseStart > FINAL * 1000) return this.playAll();\n      return next();\n    }\n  };\n\n  ensureEls() {\n    const doc = this.state.doc;\n    const grab = (ref, sel, attr) => { const arr = []; ref.current && ref.current.querySelectorAll(sel).forEach(el => { arr[+el.getAttribute(attr)] = el; }); return arr; };\n    if (this.elsDoc === doc && this.els && this.els.J.length) return;\n    this.els = { J: grab(this.jevRef, '[data-i]', 'data-i'), H: grab(this.haiRef, '[data-i]', 'data-i'), B: grab(this.jevRef, '[data-b]', 'data-b') };\n    this.cache = { J: [], H: [], B: [] }; this.elsDoc = doc;\n  }\n\n  applyFrame() {\n    if (!this.state.data) return;\n    const P = this.getPrep(this.state.doc); this.ensureEls();\n    const t = this.t, ph = this.phase, started = ph === 'running' || ph === 'done' || ph === 'final', running = ph === 'running', gold = P.d.gold_words;\n    const res = {};\n    let readout = '';\n    for (const isJ of [true, false]) {\n      const L = isJ ? P.J : P.H, lat = L.latency_s, done = started && t >= lat;\n      const E = isJ ? this.els.J : this.els.H, C = isJ ? this.cache.J : this.cache.H;\n      let caught = 0, over = 0, leaked = 0, cur = -1, follow = -1, curItem = -1;\n      if (!isJ && started) for (let j = 0; j < P.itemTimes.length; j++) { if (P.itemTimes[j] <= t) curItem = j; }\n      for (let i = 0; i < P.n; i++) {\n        const g = gold[i]; let revealed, isCur = false;\n        if (isJ) {\n          revealed = started && t >= P.jEnd[i] && (L.asked[i] || L.masked[i]);\n          if (L.asked[i] && running && t >= P.jStart[i] && t < P.jEnd[i]) { isCur = true; cur = i; }\n\n        } else {\n          revealed = started && L.masked[i] && t >= P.hRev[i];\n          if (revealed) follow = i;\n          isCur = revealed && running && curItem >= 0 && P.hItem[i] === curItem;\n        }\n        const block = revealed && L.masked[i];\n        if (block) { if (g) caught++; else over++; }\n        const leak = done && g && !L.masked[i];\n        if (leak) leaked++;\n        if (isJ) {\n          const bEl = this.els.B[i];\n          if (bEl) {\n            const passed = started && (t >= P.jEnd[i] || isCur);\n            const bk = !passed || block ? '' : L.asked[i] ? 'a' : 's';\n            if (this.cache.B[i] !== bk) {\n              this.cache.B[i] = bk; const bs = bEl.style;\n              bs.height = bk === 'a' ? '3px' : '0';\n              bs.background = bk === 'a' ? P.pCol[i] : 'transparent';\n              bs.borderBottom = bk === 's' ? '3px dotted ' + SKIP : 'none';\n            }\n          }\n        }\n        let bg = '', color = '', outline = '';\n        if (block) { bg = g ? INK : GREY; color = 'transparent'; }\n        else { if (g) bg = 'rgba(201,133,0,0.25)'; if (isCur && isJ) bg = 'rgba(217,89,38,0.32)'; }\n        if (isCur && !isJ) outline = '2px solid ' + HAI;\n        const k = bg + '|' + color + '|' + outline + '|' + (leak ? 1 : 0);\n        const el = E[i];\n        if (el && C[i] !== k) {\n          C[i] = k; const s = el.style;\n          s.background = bg; s.color = color; s.outline = outline; s.outlineOffset = outline ? '1px' : '';\n          s.textDecoration = leak ? 'underline' : ''; s.textDecorationColor = leak ? RED : '';\n          s.textDecorationThickness = leak ? '2px' : ''; s.textUnderlineOffset = leak ? '3px' : '';\n        }\n      }\n      if (isJ && cur >= 0) { const w = P.segs[cur].text; readout = (w.length > 12 ? w.slice(0, 11) + '…' : w).padStart(12) + '  p ' + L.p_pii[cur].toFixed(2) + (L.p_pii[cur] >= THR ? ' → mask' : ''); }\n      res[isJ ? 'J' : 'H'] = { caught, over, leaked, done };\n      if (started) this.follow(isJ ? this.jevRef : this.haiRef, isJ ? cur : follow, isJ ? 'j' : 'h');\n    }\n    if (this.readoutRef.current && this.readoutRef.current.textContent !== readout) this.readoutRef.current.textContent = readout;\n    const st = this.stripRef.current;\n    if (st) {\n      const prog = started ? Math.min(1, t / P.H.latency_s) : 0;\n      const s = P.ans.slice(0, Math.floor(prog * P.ans.length));\n      if (st.textContent !== s) { st.textContent = s; st.scrollTop = st.scrollHeight; }\n    }\n    this.counts = res;\n  }\n\n  follow(ref, idx, tag) {\n    const c = ref.current; if (!c || idx < 0) return;\n    if (this['_f' + tag] === idx) return; this['_f' + tag] = idx;\n    const el = c.querySelector('[data-i=\"' + idx + '\"]'); if (!el) return;\n    const cr = c.getBoundingClientRect(), er = el.getBoundingClientRect();\n    const rel = er.top - cr.top, h = c.clientHeight;\n    if (rel < h * 0.12 || rel > h * 0.7) c.scrollTop = Math.max(0, c.scrollTop + rel - h * 0.35);\n  }\n\n\n  renderVals() {\n    const { data, doc, slow, phase, mode, tally } = this.state;\n    const t = this.t;\n    const fs = this.props.fontSize ?? 13;\n    const segBtn = on => ({ fontFamily: 'inherit', fontSize: '13px', border: 'none', padding: '7px 14px', cursor: 'pointer', background: on ? '#EDE6D8' : 'transparent', color: on ? '#1A1714' : '#C9C1B2' });\n    const playing = mode === 'all';\n    const T = Object.values(tally), m = T.length;\n    const sum = f => T.reduce((a, r) => a + f(r), 0);\n    const jW = T.filter(r => r.jF2 > r.hF2).length, hW = T.filter(r => r.hF2 > r.jF2).length;\n    const jS = T.filter(r => r.jLat < r.hLat).length, hS = T.filter(r => r.hLat < r.jLat).length;\n    const summ = (fk, lk) => m ? 'F2 ' + (sum(r => r[fk]) / m).toFixed(3) + ' · ' + sum(r => r[lk]).toFixed(1) + ' s' : '';\n    const base = {\n      playAllBtn: playing ? this.stopAll : this.playAll, playAllLabel: playing ? 'stop' : 'play all ' + (data ? data.length : 10),\n      closeFinal: this.closeFinal, replayAll: this.playAll, showContinue: !this.auto, raceOne: this.raceOne, prevDoc: () => this.nav(-1), nextDoc: () => this.nav(1), raceOneLabel: !playing && phase === 'done' ? 'race this one again' : 'race this one',\n      setReal: () => this.setSpeed(false), setSlow: () => this.setSpeed(true),\n      realStyle: segBtn(!slow), slowStyle: segBtn(slow),\n      jF2W: String(jW), hF2W: String(hW), jSpW: String(jS), hSpW: String(hS),\n      jSummary: summ('jF2', 'jLat'), hSummary: summ('hF2', 'hLat'),\n      introBar: this.introBar,\n    };\n    if (!data) return { ...base, loading: true, cells: [], lanes: [], rows: [], rampSw: [], verdict: '', showIntro: false, showFinal: false, hasTotal: false };\n\n    const P = this.getPrep(doc), { J, H } = P;\n    const started = phase === 'running' || phase === 'done' || phase === 'final';\n    const Cn = this.counts || { J: { caught: 0, over: 0, leaked: 0 }, H: { caught: 0, over: 0, leaked: 0 } };\n    const who = (a, b, hiWins) => a === b ? 'tie' : ((hiWins ? a > b : a < b) ? 'Jev' : 'Haiku');\n    const whoCol = w => ({ fontWeight: 600, color: w === 'Jev' ? JEV : w === 'Haiku' ? HAI : '#C9C1B2' });\n\n    const cells = data.map((d, i) => {\n      const r = tally[i], cur = i === doc;\n      const fw = r ? who(r.jF2, r.hF2, true) : '—', tw = r ? who(r.jLat, r.hLat, false) : '—';\n      const f2t = !r ? '—' : fw === 'tie' ? 'tie' : fw + ' +' + Math.abs(r.jF2 - r.hF2).toFixed(3).replace(/^0/, '');\n      const tmt = !r ? '—' : tw === 'tie' ? 'tie' : tw + ' ' + (Math.max(r.jLat, r.hLat) / Math.min(r.jLat, r.hLat)).toFixed(1) + '×';\n      return {\n        num: pad(i + 1), words: d.words.length + 'w', kind: d.dataset === 'tab' ? 'court' : 'business',\n        f2: f2t, tm: tmt, f2Style: whoCol(fw), tStyle: whoCol(tw),\n        pick: () => this.raceDoc(i),\n        style: { fontFamily: 'inherit', fontSize: '11px', textAlign: 'left', background: cur ? '#26211C' : 'transparent', color: '#EDE6D8', border: 'none', borderTop: '2px solid ' + (cur ? '#EDE6D8' : r ? '#6F685D' : '#3A332C'), padding: '7px 6px 6px', cursor: 'pointer', display: 'flex', flexDirection: 'column', gap: '3px', minWidth: 0 },\n      };\n    });\n\n    const buildLane = isJ => {\n      const L = isJ ? J : H, lat = L.latency_s, done = started && t >= lat, c = Cn[isJ ? 'J' : 'H'];\n      const prog = started ? Math.min(1, t / lat) : 0;\n      const color = isJ ? JEV : HAI;\n      return {\n        name: isJ ? 'Jev' : 'Claude Haiku 4.5',\n        nameStyle: { fontSize: '15px', fontWeight: 600, color },\n        timer: (started ? Math.min(t, lat) : 0).toFixed(2) + ' s',\n        timerStyle: { fontSize: '26px', fontWeight: 500, color, fontVariantNumeric: 'tabular-nums' },\n        stats: [\n          { label: 'caught', value: String(c.caught) },\n          { label: 'leaked', value: done ? String(c.leaked) : '—' },\n          { label: 'over-masked', value: String(c.over) },\n          { label: 'cost', value: (L.cost_usd * 100 * prog).toFixed(3) + '¢' },\n          { label: 'F2', value: done ? f2(L).toFixed(3) : '—' },\n        ],\n        title: isJ ? 'Jev' : 'Claude Haiku 4.5',\n        titleStyle: { fontSize: '12px', fontWeight: 600, color },\n        subtitle: isJ ? 'stop words never asked · masks at p ≥ ' + THR.toFixed(2) : '',\n        hasReadout: isJ, readoutRef: this.readoutRef,\n        showLeak: done, leakText: L.fn + ' leaked',\n        ref: isJ ? this.jevRef : this.haiRef,\n        bodyStyle: { flex: 1, minHeight: 0, overflowY: 'auto', position: 'relative', padding: '16px 28px 28px', fontSize: fs + 'px', lineHeight: 2.2 },\n        words: isJ ? P.wordsJ : P.wordsH, tail: P.tail,\n        hasStrip: !isJ, stripRef: this.stripRef,\n        stripLabel: 'answer · ' + Math.floor(prog * P.ans.length) + ' / ' + P.ans.length + ' chars',\n      };\n    };\n\n    const label = 'Document ' + pad(doc + 1) + ' of ' + data.length + ' · ' + this.docLabel(doc);\n    const verdict = label;\n    const pctL = L => (L.tp + L.fn) ? (100 * L.fn / (L.tp + L.fn)).toFixed(1) + '%' : '0%';\n    const dim = { textAlign: 'right', color: '#6F685D' };\n    const win = (isWin, accent) => ({ textAlign: 'right', color: isWin ? accent : '#C9C1B2', fontWeight: isWin ? 600 : 400 });\n    const rowStyle = cur => ({ display: 'grid', gridTemplateColumns: '180px repeat(10,minmax(88px,1fr))', gap: '8px', whiteSpace: 'nowrap', padding: '7px 8px', borderBottom: '1px solid #2A2520', background: cur ? '#26211C' : 'transparent', cursor: 'pointer' });\n    const mk = (r, label) => {\n      const fwn = who(r.jF2, r.hF2, true), twn = who(r.jLat, r.hLat, false);\n      const ljv = r.J.fn / Math.max(1, r.J.tp + r.J.fn), lhv = r.H.fn / Math.max(1, r.H.tp + r.H.fn);\n      const lw = ljv === lhv ? 'tie' : ljv < lhv ? 'Jev' : 'Haiku', cw = r.J.cost === r.H.cost ? 'tie' : r.J.cost < r.H.cost ? 'Jev' : 'Haiku';\n      const ac = w => w === 'Jev' ? JEV : w === 'Haiku' ? HAI : '#C9C1B2';\n      return {\n        fj: r.jF2.toFixed(3), fh: r.hF2.toFixed(3), fjS: win(fwn === 'Jev', JEV), fhS: win(fwn === 'Haiku', HAI),\n        lead: fwn === 'tie' ? 'tie' : (fwn === 'Jev' ? 'Jev' : 'Haiku') + ' +' + Math.abs(r.jF2 - r.hF2).toFixed(3), leadS: { textAlign: 'right', color: ac(fwn) },\n        tj: r.jLat.toFixed(2) + ' s', th: r.hLat.toFixed(2) + ' s', tjS: win(twn === 'Jev', JEV), thS: win(twn === 'Haiku', HAI),\n        fast: twn === 'tie' ? 'tie' : (twn === 'Jev' ? 'Jev' : 'Haiku') + ' ' + (Math.max(r.jLat, r.hLat) / Math.min(r.jLat, r.hLat)).toFixed(1) + '×', fastS: { textAlign: 'right', color: ac(twn) },\n        lj: (100 * ljv).toFixed(1) + '% · ' + r.J.fn, lh: (100 * lhv).toFixed(1) + '% · ' + r.H.fn, ljS: win(lw === 'Jev', JEV), lhS: win(lw === 'Haiku', HAI),\n        cj: (r.J.cost * 100).toFixed(3) + '¢', ch: (r.H.cost * 100).toFixed(3) + '¢', cjS: win(cw === 'Jev', JEV), chS: win(cw === 'Haiku', HAI),\n      };\n    };\n    const blank = { fj: '—', fh: '—', lead: '—', tj: '—', th: '—', fast: '—', lj: '—', lh: '—', cj: '—', ch: '—' };\n    ['fjS', 'fhS', 'leadS', 'tjS', 'thS', 'fastS', 'ljS', 'lhS', 'cjS', 'chS'].forEach(k => blank[k] = dim);\n    const rows = data.map((d, i) => ({ num: pad(i + 1), kind: (d.dataset === 'tab' ? 'court' : 'business') + ' · ' + d.words.length + 'w', pick: () => this.raceDoc(i), style: rowStyle(i === doc), ...(tally[i] ? mk(tally[i]) : blank) }));\n    let tot = null, finalRows = [];\n    if (m) {\n      const agg = k => T.reduce((a, r) => ({ tp: a.tp + r[k].tp, fp: a.fp + r[k].fp, fn: a.fn + r[k].fn, cost: a.cost + r[k].cost }), { tp: 0, fp: 0, fn: 0, cost: 0 });\n      const AJ = agg('J'), AH = agg('H');\n      tot = { label: m === data.length ? 'all ' + m + ' · mean/total' : m + ' raced · mean/total', ...mk({ jF2: sum(r => r.jF2) / m, hF2: sum(r => r.hF2) / m, jLat: sum(r => r.jLat), hLat: sum(r => r.hLat), J: AJ, H: AH }) };\n      const fr = (k, jv, hv, lowWins, fmt) => { const jw = lowWins ? jv < hv : jv > hv, hw = lowWins ? hv < jv : hv > jv; return { k, j: fmt(jv), h: fmt(hv), jS: { textAlign: 'right', color: jw ? JEV : '#C9C1B2', fontWeight: jw ? 600 : 400 }, hS: { textAlign: 'left', color: hw ? HAI : '#C9C1B2', fontWeight: hw ? 600 : 400 } }; };\n      finalRows = [\n        fr('MEAN F2', sum(r => r.jF2) / m, sum(r => r.hF2) / m, false, v => v.toFixed(3)),\n        fr('TOTAL TIME', sum(r => r.jLat), sum(r => r.hLat), true, v => v.toFixed(2) + ' s'),\n        fr('LEAKED', AJ.fn / Math.max(1, AJ.tp + AJ.fn), AH.fn / Math.max(1, AH.tp + AH.fn), true, v => (100 * v).toFixed(1) + '%'),\n        fr('TOTAL COST', AJ.cost * 100, AH.cost * 100, true, v => v.toFixed(3) + '¢'),\n      ];\n    }\n    const rampSw = [0, 0.1, 0.2, 0.3, 0.4].map(p => ({ width: '10px', height: '10px', background: rampColor(p, this.props.pScale) }));\n    return {\n      ...base, loading: false, cells, lanes: [buildLane(true), buildLane(false)], verdict,\n      showIntro: phase === 'intro', introNum: pad(doc + 1) + ' / ' + pad(data.length), introSub: this.docLabel(doc),\n      rows, tot, hasTotal: !!tot, finalRows, rampSw,\n      scoreNote: 'leaked = share of personal-info words left unmasked · click a row to race it · ← → step through documents',\n      showFinal: phase === 'final', finalKicker: 'FINAL · ' + m + ' DOCUMENTS',\n      finalF2: jW + ' : ' + hW, finalSp: jS + ' : ' + hS,\n      finalSub: m ? 'mean F2  Jev ' + (sum(r => r.jF2) / m).toFixed(3) + ' · Haiku 4.5 ' + (sum(r => r.hF2) / m).toFixed(3) + '      total time  Jev ' + sum(r => r.jLat).toFixed(2) + ' s · Haiku 4.5 ' + sum(r => r.hLat).toFixed(2) + ' s' : '',\n    };\n  }\n}\n<\u002Fscript>\n\n\n\n<\u002Fbody><\u002Fhtml>"
